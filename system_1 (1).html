<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admissions Ledger — 1 Aug 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --paper-tint:#faf8f3;
    --ink:#1c1a16;
    --ink-soft:#6b6558;
    --gold:#b8863d;
    --gold-deep:#8f6a2e;
    --rule:#e6ddc9;
    --coral:#b5563f;
    --forest:#3f6b52;
    --slate:#3d5a73;
    --plum:#6b4d7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:30px 22px 44px;
    background:var(--paper-tint);
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
  }
  .masthead{
    max-width:1180px; margin:0 auto 24px;
    border-bottom:2px solid var(--gold);
    padding-bottom:16px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;
  }
  .title-block{display:flex; flex-direction:column; gap:4px;}
  .eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-deep);}
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:32px;
    margin:0; color:var(--ink); letter-spacing:-.01em;
  }
  .meta{font-size:11.5px; color:var(--ink-soft); line-height:1.6;}
  .meta b{color:var(--ink);}
  .stamp{
    font-family:'Fraunces', serif; font-weight:700; font-size:13px;
    border:1.5px solid var(--gold); color:var(--gold-deep);
    padding:7px 14px; border-radius:2px; letter-spacing:.05em;
    transform:rotate(-2deg); white-space:nowrap;
  }

  .grid{
    max-width:1180px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr; gap:18px;
  }
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}

  .ledger-card{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:4px;
    box-shadow:0 4px 14px -8px rgba(28,26,22,.18);
    overflow:hidden;
    position:relative;
  }
  .ledger-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background:var(--gold);
  }
  .card-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:16px 18px 10px; border-bottom:1px dashed var(--rule);
  }
  .card-head .team{
    font-family:'Fraunces', serif; font-weight:600; font-size:19px; color:var(--ink);
  }
  .card-head .rank{
    font-size:10px; color:var(--gold-deep); letter-spacing:.15em; text-transform:uppercase;
  }
  .card-head .team-total{
    font-family:'Fraunces', serif; font-weight:700; font-size:24px; color:var(--coral); text-align:right;
  }
  .card-head .team-total sub{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); letter-spacing:.05em; text-transform:uppercase; display:block; margin-top:-2px;
  }

  table{width:100%; border-collapse:collapse; font-size:11.5px;}
  thead th{
    text-align:left; padding:8px 18px 6px; font-size:9.5px; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.08em; font-weight:600;
    border-bottom:1px solid var(--rule);
  }
  thead th.num{text-align:center;}
  tbody td{ padding:6px 18px; border-bottom:1px solid #f0ead9; }
  tbody tr:last-child td{border-bottom:none;}
  tbody td.name{font-weight:500; color:var(--ink);}
  tbody td.num{text-align:center; color:var(--ink-soft);}
  tbody tr:nth-child(even){background:rgba(184,134,61,.05);}

  .pip{
    display:inline-block; min-width:18px; padding:1px 6px; border-radius:9px;
    font-size:10.5px; font-weight:600; font-family:'IBM Plex Mono',monospace;
  }
  .pip.total{background:var(--ink); color:#fff;}
  .pip.partial{background:rgba(181,86,63,.12); color:var(--coral);}
  .pip.annual{background:rgba(63,107,82,.12); color:var(--forest);}
  .pip.sem{background:rgba(61,90,115,.12); color:var(--slate);}
  .pip.full{background:rgba(107,77,122,.12); color:var(--plum);}
  .dash{color:#c9c2ae;}

  .team-foot{
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;
    padding:9px 18px; background:var(--paper-tint);
    font-size:10.5px; letter-spacing:.03em; border-top:1px solid var(--rule);
  }
  .team-foot span{color:var(--ink-soft);}
  .team-foot b{color:var(--gold-deep); margin-left:5px;}

  .summary{
    max-width:1180px; margin:26px auto 0;
    background:var(--paper);
    border:1px solid var(--rule); border-top:2px solid var(--gold);
    padding:18px 22px; display:flex; flex-wrap:wrap;
    justify-content:space-between;
  }
  .summary .cell{
    flex:1; min-width:130px; padding:6px 14px;
    border-left:1px solid var(--rule);
  }
  .summary .cell:first-child{border-left:none;}
  .summary .label{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);}
  .summary .value{font-family:'Fraunces',serif; font-weight:700; font-size:26px; margin-top:2px;}
  .v-total{color:var(--ink);}
  .v-partial{color:var(--coral);}
  .v-annual{color:var(--forest);}
  .v-sem{color:var(--slate);}
  .v-full{color:var(--plum);}

  .legend{
    max-width:1180px; margin:14px auto 0; display:flex; gap:16px; flex-wrap:wrap;
    font-size:10.5px; color:var(--ink-soft);
  }
  .legend span::before{content:"● "; }
  .legend .l-partial::before{color:var(--coral);}
  .legend .l-annual::before{color:var(--forest);}
  .legend .l-sem::before{color:var(--slate);}
  .legend .l-full::before{color:var(--plum);}

  .empty-note{
    max-width:1180px; margin:8px auto 0; font-size:11px; color:var(--ink-soft); text-align:center;
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="title-block">
    <span class="eyebrow">DegreeFYD · Admissions Desk</span>
    <h1>The Admission Ledger</h1>
    <div class="meta">Course status = <b>Admission</b>, deduped first-hit per student/course · grouped Team Owner → Counsellor</div>
  </div>
  <div class="stamp">1 AUG 2026</div>
</div>

<div class="grid" id="grid"></div>

<div class="summary" id="summary"></div>
<div class="legend">
  <span class="l-partial">Partial Paid</span>
  <span class="l-annual">Annual Paid</span>
  <span class="l-sem">Semester Paid</span>
  <span class="l-full">Full Paid</span>
</div>
<div class="empty-note">Teams not shown (Siddarth Kumar, Vishal Gaur) closed zero admissions on this date.</div>

<script>
const data = [
{"team_owner":"Prashant Mishra","counsellor_name":"Akshay Saxena","total_admissions":1,"partial_paid":0,"annual_paid":0,"semester_paid":1,"full_paid":0},
{"team_owner":"Sunil","counsellor_name":"Vikas","total_admissions":3,"partial_paid":0,"annual_paid":3,"semester_paid":0,"full_paid":0},
{"team_owner":"Sunil","counsellor_name":"Parth garg","total_admissions":1,"partial_paid":0,"annual_paid":0,"semester_paid":1,"full_paid":0},
{"team_owner":"Sunil","counsellor_name":"Abhishek Swami","total_admissions":1,"partial_paid":0,"annual_paid":0,"semester_paid":0,"full_paid":1},
{"team_owner":"Vartika Thakur","counsellor_name":"sanjay verma","total_admissions":1,"partial_paid":0,"annual_paid":0,"semester_paid":1,"full_paid":0},
{"team_owner":"Varun","counsellor_name":"Om Sharma","total_admissions":1,"partial_paid":0,"annual_paid":1,"semester_paid":0,"full_paid":0},
{"team_owner":"Varun","counsellor_name":"Prerna Sharma","total_admissions":1,"partial_paid":0,"annual_paid":0,"semester_paid":1,"full_paid":0}
];

const teams = {};
data.forEach(r=>{ (teams[r.team_owner] = teams[r.team_owner]||[]).push(r); });

const grid = document.getElementById('grid');
let grand = {total:0,partial:0,annual:0,sem:0,full:0};

const orderedTeams = Object.keys(teams).sort((a,b)=>{
  const ta = teams[a].reduce((s,r)=>s+r.total_admissions,0);
  const tb = teams[b].reduce((s,r)=>s+r.total_admissions,0);
  return tb-ta;
});

orderedTeams.forEach((team, idx)=>{
  const rows = teams[team].sort((a,b)=>b.total_admissions-a.total_admissions);
  const t = rows.reduce((acc,r)=>{
    acc.total+=r.total_admissions; acc.partial+=r.partial_paid; acc.annual+=r.annual_paid;
    acc.sem+=r.semester_paid; acc.full+=r.full_paid; return acc;
  },{total:0,partial:0,annual:0,sem:0,full:0});
  grand.total+=t.total; grand.partial+=t.partial; grand.annual+=t.annual; grand.sem+=t.sem; grand.full+=t.full;

  const pip = (val, cls) => val ? `<span class="pip ${cls}">${val}</span>` : `<span class="dash">–</span>`;

  const card = document.createElement('div');
  card.className='ledger-card';
  card.innerHTML = `
    <div class="card-head">
      <div>
        <div class="rank">Rank ${String(idx+1).padStart(2,'0')} of ${orderedTeams.length}</div>
        <div class="team">${team}</div>
      </div>
      <div class="team-total">${t.total}<sub>admissions</sub></div>
    </div>
    <table>
      <thead><tr>
        <th>Counsellor</th><th class="num">Total</th><th class="num">Partial</th><th class="num">Annual</th><th class="num">Semester</th><th class="num">Full</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
        <tr>
          <td class="name">${r.counsellor_name}</td>
          <td class="num">${pip(r.total_admissions,'total')}</td>
          <td class="num">${pip(r.partial_paid,'partial')}</td>
          <td class="num">${pip(r.annual_paid,'annual')}</td>
          <td class="num">${pip(r.semester_paid,'sem')}</td>
          <td class="num">${pip(r.full_paid,'full')}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="team-foot">
      <span>${rows.length} counsellor${rows.length>1?'s':''} closed today</span>
      <span>Partial <b>${t.partial}</b> &nbsp; Annual <b>${t.annual}</b> &nbsp; Semester <b>${t.sem}</b> &nbsp; Full <b>${t.full}</b></span>
    </div>`;
  grid.appendChild(card);
});

document.getElementById('summary').innerHTML = `
  <div class="cell"><div class="label">Total Admissions</div><div class="value v-total">${grand.total}</div></div>
  <div class="cell"><div class="label">Partial Paid</div><div class="value v-partial">${grand.partial}</div></div>
  <div class="cell"><div class="label">Annual Paid</div><div class="value v-annual">${grand.annual}</div></div>
  <div class="cell"><div class="label">Semester Paid</div><div class="value v-sem">${grand.sem}</div></div>
  <div class="cell"><div class="label">Full Paid</div><div class="value v-full">${grand.full}</div></div>
`;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outbound Report · 13 June 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #F8F9FB;
    color: #111827;
    padding: 36px 40px 48px;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .logo-mark {
    width: 38px; height: 38px; border-radius: 10px;
    background: #111827;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff; letter-spacing: -0.5px;
  }
  .topbar h1 { font-size: 1.05rem; font-weight: 700; color: #111827; }
  .topbar p  { font-size: .72rem; color: #9ca3af; margin-top: 2px; }
  .pill {
    font-size: .62rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    padding: 5px 13px; border-radius: 999px;
    background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0;
  }
  .kpis { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-bottom: 28px; }
  .kpi-card {
    background: #fff; border: 1px solid #e5e7eb;
    border-radius: 12px; padding: 16px 18px;
    position: relative; overflow: hidden;
  }
  .kpi-card::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--ac, #e5e7eb); border-radius: 12px 12px 0 0;
  }
  .kpi-card .v { font-size: 1.6rem; font-weight: 800; color: var(--vc, #111827); line-height: 1; margin-top: 4px; }
  .kpi-card .l { font-size: .63rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .7px; margin-top: 6px; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .col    { display: flex; flex-direction: column; gap: 16px; }
  .tcard  { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; }
  .tcard-head {
    padding: 13px 18px 12px; border-bottom: 1px solid #f3f4f6;
    display: flex; align-items: center; justify-content: space-between;
  }
  .tname {
    display: flex; align-items: center; gap: 9px;
    font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
  }
  .tdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .tmeta { font-size: .7rem; color: #9ca3af; display: flex; gap: 4px; }
  .tmeta span + span::before { content: '·'; margin-right: 4px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 7px 16px;
    font-size: .61rem; font-weight: 700; text-transform: uppercase; letter-spacing: .65px;
    color: #9ca3af; text-align: right; white-space: nowrap;
    background: #FAFAFA; border-bottom: 1px solid #f3f4f6;
  }
  thead th:first-child { text-align: left; }
  tbody td {
    padding: 9px 16px; text-align: right;
    color: #374151; font-size: .8rem;
    border-bottom: 1px solid #f9fafb;
    font-variant-numeric: tabular-nums;
  }
  tbody td:first-child { text-align: left; font-weight: 600; color: #111827; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafafa; }
  .zero-row td { color: #d1d5db; }
  .zero-row td:first-child { color: #9ca3af; font-weight: 500; }
  tfoot tr { background: #f9fafb; }
  tfoot td {
    padding: 9px 16px; text-align: right;
    font-size: .74rem; font-weight: 700; color: #374151;
    border-top: 1px solid #e5e7eb;
    font-variant-numeric: tabular-nums;
  }
  tfoot td:first-child { text-align: left; font-size: .62rem; text-transform: uppercase; letter-spacing: .7px; color: #9ca3af; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: .7rem; font-weight: 700; }
  .cg { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .co { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
  .cr { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .cx { background: #f3f4f6; color: #9ca3af; border: 1px solid #e5e7eb; }
  footer { text-align: center; margin-top: 24px; font-size: .68rem; color: #9ca3af; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-mark">OB</div>
    <div>
      <h1>Outbound Call Report</h1>
      <p>13 June 2026 &nbsp;·&nbsp; Till 10:59 AM &nbsp;·&nbsp; 18 counsellors &nbsp;·&nbsp; 5 teams</p>
    </div>
  </div>
  <span class="pill">Outbound only</span>
</div>

<div class="kpis">
  <div class="kpi-card" style="--ac:#e5e7eb"><div class="v">185</div><div class="l">Total calls</div></div>
  <div class="kpi-card" style="--ac:#22c55e;--vc:#16a34a"><div class="v">82</div><div class="l">Connected</div></div>
  <div class="kpi-card" style="--ac:#3b82f6;--vc:#2563eb"><div class="v" id="k-rate"></div><div class="l">Connect rate</div></div>
  <div class="kpi-card" style="--ac:#e5e7eb"><div class="v" id="k-talk"></div><div class="l">Total talk time</div></div>
  <div class="kpi-card" style="--ac:#e5e7eb"><div class="v" id="k-avg"></div><div class="l">Avg / connected</div></div>
</div>

<div class="layout">
  <div class="col" id="col-l"></div>
  <div class="col" id="col-r"></div>
</div>

<footer>Source: call_13_june.csv &nbsp;·&nbsp; Outbound calls only &nbsp;·&nbsp; 13 June 2026</footer>

<script>
const data = [
  {name:'Prashant',     sup:'Sunil Team',    total:27, answered:11, talk_secs:2153, avg_secs:195},
  {name:'Tanisha',      sup:'Varun Team',    total:11, answered:8,  talk_secs:2101, avg_secs:262},
  {name:'LaxmiNarayan', sup:'Sid Team',      total:12, answered:6,  talk_secs:1578, avg_secs:263},
  {name:'Nitin',        sup:'Vartika Team',  total:15, answered:8,  talk_secs:1485, avg_secs:185},
  {name:'Aditya',       sup:'Vartika Team',  total:11, answered:6,  talk_secs:1421, avg_secs:236},
  {name:'Virat',        sup:'Sid Team',      total:17, answered:6,  talk_secs:1310, avg_secs:218},
  {name:'Swapnil',      sup:'Prashant Team', total:11, answered:7,  talk_secs:1054, avg_secs:150},
  {name:'Vikas',        sup:'Sunil Team',    total:24, answered:7,  talk_secs:1004, avg_secs:143},
  {name:'Shiv',         sup:'Vartika Team',  total:11, answered:6,  talk_secs:930,  avg_secs:155},
  {name:'Vishwajeet',   sup:'Vishal Team',   total:16, answered:6,  talk_secs:229,  avg_secs:38},
  {name:'Divya',        sup:'Prashant Team', total:9,  answered:4,  talk_secs:150,  avg_secs:37},
  {name:'Avneet',       sup:'Vishal Team',   total:1,  answered:0,  talk_secs:0,    avg_secs:0},
  {name:'Sanjay',       sup:'Vartika Team',  total:0,  answered:0,  talk_secs:0,    avg_secs:0},
  {name:'Sagar',        sup:'Vartika Team',  total:0,  answered:0,  talk_secs:0,    avg_secs:0},
  {name:'Himanshi',     sup:'Sunil Team',    total:0,  answered:0,  talk_secs:0,    avg_secs:0},
  {name:'Arnav',        sup:'Vishal Team',   total:0,  answered:0,  talk_secs:0,    avg_secs:0},
  {name:'Anshika',      sup:'Varun Team',    total:0,  answered:0,  talk_secs:0,    avg_secs:0},
  {name:'Abhishek',     sup:'Sunil Team',    total:0,  answered:0,  talk_secs:0,    avg_secs:0},
];

const teamCfg = {
  'Vartika Team':  '#8b5cf6',
  'Sunil Team':    '#0ea5e9',
  'Vishal Team':   '#2563eb',
  'Sid Team':      '#f59e0b',
  'Varun Team':    '#10b981',
  'Prashant Team': '#ec4899',
};
const leftOrder  = ['Vartika Team','Sunil Team','Vishal Team'];
const rightOrder = ['Sid Team','Varun Team','Prashant Team'];

function fmtTalk(s) {
  if (!s) return '—';
  const m = Math.round(s/60), h = Math.floor(m/60), min = m%60;
  return h > 0 ? `${h}h ${String(min).padStart(2,'0')}m` : `${m}m`;
}
function fmtAvg(s) {
  if (!s) return '—';
  const m = Math.floor(s/60), sec = s%60;
  return m > 0 ? `${m}m ${String(sec).padStart(2,'0')}s` : `${sec}s`;
}
function chip(pct, total) {
  if (!total) return `<span class="chip cx">—</span>`;
  const cls = pct >= 45 ? 'cg' : pct >= 30 ? 'co' : 'cr';
  return `<span class="chip ${cls}">${pct}%</span>`;
}

document.getElementById('k-rate').textContent = Math.round(82/185*100) + '%';
document.getElementById('k-talk').textContent = fmtTalk(14661);
document.getElementById('k-avg').textContent  = fmtAvg(Math.round(14661/82));

const grouped = {};
data.forEach(d => { if (!grouped[d.sup]) grouped[d.sup] = []; grouped[d.sup].push(d); });

function buildCard(teamName) {
  const color   = teamCfg[teamName] || '#6b7280';
  const members = (grouped[teamName]||[]).sort((a,b) => b.talk_secs - a.talk_secs);
  const tCalls  = members.reduce((a,d)=>a+d.total,0);
  const tAns    = members.reduce((a,d)=>a+d.answered,0);
  const tTalk   = members.reduce((a,d)=>a+d.talk_secs,0);
  const tRate   = tCalls ? Math.round(tAns/tCalls*100) : 0;
  const tAvg    = tAns   ? Math.round(tTalk/tAns) : 0;

  const rows = members.map(d => {
    const pct = d.total ? Math.round(d.answered/d.total*100) : 0;
    return `<tr class="${!d.total ? 'zero-row' : ''}">
      <td>${d.name}</td>
      <td>${d.total || '0'}</td>
      <td>${d.answered || '0'}</td>
      <td>${chip(pct, d.total)}</td>
      <td>${fmtTalk(d.talk_secs)}</td>
      <td>${fmtAvg(d.avg_secs)}</td>
    </tr>`;
  }).join('');

  const card = document.createElement('div');
  card.className = 'tcard';
  card.innerHTML = `
    <div class="tcard-head">
      <div class="tname" style="color:${color}">
        <span class="tdot" style="background:${color}"></span>${teamName}
      </div>
      <div class="tmeta">
        <span>${tCalls} calls</span>
        <span>${tAns} connected</span>
        <span>${fmtTalk(tTalk)}</span>
      </div>
    </div>
    <table>
      <thead><tr>
        <th>Counsellor</th><th>Calls</th><th>Connected</th>
        <th>Connect&nbsp;%</th><th>Talk&nbsp;Time</th><th>Avg&nbsp;/&nbsp;Call</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td>Team Total</td>
        <td>${tCalls}</td><td>${tAns}</td>
        <td>${chip(tRate, tCalls)}</td>
        <td>${fmtTalk(tTalk)}</td>
        <td>${fmtAvg(tAvg)}</td>
      </tr></tfoot>
    </table>`;
  return card;
}

leftOrder.forEach(t  => document.getElementById('col-l').appendChild(buildCard(t)));
rightOrder.forEach(t => document.getElementById('col-r').appendChild(buildCard(t)));
</script>
</body>
</html>
